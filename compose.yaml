services:
  lbpsearch:
    image: lbpsearch:latest
    build: .
    network_mode: host
    volumes:
      - ./data:/data
    environment:
      LBPSEARCH_GLOBAL_URL: https://zaprit.fish
      LBPSEARCH_DATABASE_NAME: lbpsearch
      LBPSEARCH_DATABASE_USER: lbpsearch
      LBPSEARCH_DATABASE_PASSWORD: lbpsearch
      LBPSEARCH_DATABASE_HOST: localhost
      LBPSEARCH_SHOW_SPONSOR_MESSAGE: true

